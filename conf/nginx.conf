worker_processes auto;

# Whitelist env vars so they are passed to workers (nginx strips others).
# config.lua reads these via os.getenv() inside each worker.
env DMM_AUTH_TOKEN;
env DMM_SIGN_TTL;
env DMM_ALLOW_IPS;
env DMM_API_PROTECT;
env DMM_RATE_PER_MIN;

error_log /var/log/openresty/error.log warn;
pid /var/run/openresty.pid;

events {
    worker_connections 2048;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/openresty/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    lua_package_path "/etc/openresty/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
    lua_shared_dict api_locks 1m;
    lua_shared_dict rate_limit 20m;

    server {
        listen 80;
        server_name _;

        # --- API: Cover ---
        location ~ ^/api/cover/(?<api_id>[^/]+)$ {
            access_by_lua_block {
                local access = require "access"
                access.gate()
                local router = require "router"
                router.check_auth()
            }
            content_by_lua_block {
                local router = require "router"
                router.handle_cover()
            }
        }

        # --- API: Trailer ---
        location ~ ^/api/trailer/(?<api_id>[^/]+)$ {
            access_by_lua_block {
                local access = require "access"
                access.gate()
                local router = require "router"
                router.check_auth()
            }
            content_by_lua_block {
                local router = require "router"
                router.handle_trailer()
            }
        }

        # --- Health check ---
        location = /health {
            access_by_lua_block {
                ngx.say("ok")
                return ngx.exit(ngx.HTTP_OK)
            }
        }

        # --- Proxy DMM standard image CDN (pics.dmm.co.jp) ---
        # e.g. /proxy/pics/digital/video/cid/cidpl.jpg
        location ~ ^/proxy/pics/(?<pics_path>.*)$ {
            access_by_lua_block {
                local access = require "access"
                access.gate()
                access.require_sig()
            }
            proxy_pass https://pics.dmm.co.jp/$pics_path$is_args$args;
            proxy_set_header Host pics.dmm.co.jp;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_name pics.dmm.co.jp;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
        }

        # --- Proxy DMM high-res image CDN (awsimgsrc.dmm.co.jp/pics_dig) ---
        # e.g. /proxy/aws/digital/video/cid/cidpl.jpg
        location ~ ^/proxy/aws/(?<aws_path>.*)$ {
            access_by_lua_block {
                local access = require "access"
                access.gate()
                access.require_sig()
            }
            proxy_pass https://awsimgsrc.dmm.co.jp/pics_dig/$aws_path$is_args$args;
            proxy_set_header Host awsimgsrc.dmm.co.jp;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_name awsimgsrc.dmm.co.jp;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
        }

        # --- Proxy DMM litevideo (sample movie / trailer) CDN (cc3001.dmm.co.jp) ---
        # Sends Browser UA + Referer to avoid 403 on the oppg CDN.
        # e.g. /proxy/video/litevideo/freepv/i/ipx/ipx00685/ipx00685_sm_w.mp4
        location ~ ^/proxy/video/(?<video_path>.*)$ {
            access_by_lua_block {
                local access = require "access"
                access.gate()
                access.require_sig()
            }
            proxy_pass https://cc3001.dmm.co.jp/$video_path$is_args$args;
            proxy_set_header Host cc3001.dmm.co.jp;
            proxy_set_header Accept-Encoding "";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
            proxy_set_header Referer "https://www.dmm.co.jp/";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_name cc3001.dmm.co.jp;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 10s;

            # stream video without buffering to allow seeking
            proxy_buffering off;
        }

        # --- Proxy all other requests to DMM ---
        location / {
            proxy_pass https://pics.dmm.co.jp;
            proxy_set_header Host pics.dmm.co.jp;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_ssl_name pics.dmm.co.jp;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            sub_filter_once off;
            sub_filter_types *;
        }
    }
}
