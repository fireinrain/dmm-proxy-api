# DMM Proxy API - local build
#
#   cp .env.example .env                 # then edit .env (set DMM_AUTH_TOKEN)
#   docker compose up -d --build
#
# HTTPS (SSL) - OPTIONAL: put fullchain.pem + privkey.pem into ./certs (or set
# DMM_SSL_CERTS_DIR). Entrypoint auto-detects them at startup: present -> 443
# HTTPS enabled, absent -> HTTP only.
#
# NOTE: ALL external interfaces (/api/* and /proxy/*) ALWAYS require
# Authorization: Bearer <DMM_AUTH_TOKEN>. DMM_API_PROTECT only controls whether
# /proxy/* additionally needs a signature (on) + rate-limit/IP whitelist.
version: "3.8"

services:
  dmm-proxy:
    build: .
    container_name: dmm-proxy
    ports:
      - "${DMM_PROXY_PORT:-80}:80"
      - "${DMM_PROXY_SSL_PORT:-443}:443"
    environment:
      - DMM_AUTH_TOKEN=${DMM_AUTH_TOKEN}
      - DMM_API_PROTECT=${DMM_API_PROTECT:-on}
      - DMM_SIGN_TTL=${DMM_SIGN_TTL:-220}
      - DMM_RATE_PER_MIN=${DMM_RATE_PER_MIN:-240}
      - DMM_ALLOW_IPS=${DMM_ALLOW_IPS:-}
      - DMM_CERT_DIR=${DMM_CERT_DIR:-/etc/ssl/dmm}
      - DMM_CERT_FILE=${DMM_CERT_FILE:-fullchain.pem}
      - DMM_CERT_KEY=${DMM_CERT_KEY:-privkey.pem}
    volumes:
      - ./lua:/etc/openresty/lua/:ro
      - ${DMM_SSL_CERTS_DIR:-./certs}:/etc/ssl/dmm:ro
    restart: unless-stopped
