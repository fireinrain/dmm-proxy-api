# =============================================================================
# DMM Proxy API - run from Docker Hub image (no local build)
#
# Usage:
#   cp .env.example .env          # then edit .env (set DMM_AUTH_TOKEN)
#   docker compose -f docker-compose.hub.yml up -d
#
# Requires a .env file (or exported env vars) with at least DMM_AUTH_TOKEN:
#   DMM_AUTH_TOKEN=<your-bearer-token>   # required by ALL /api/* endpoints
#
# HTTPS (SSL) - OPTIONAL: put cert files into the host dir below (default ./certs)
#   mkdir -p certs
#   cp /path/to/fullchain.pem certs/fullchain.pem
#   cp /path/to/private.key   certs/private.key
#   docker compose -f docker-compose.hub.yml up -d
# Entrypoint auto-detects them at startup: certs present -> 443 HTTPS enabled,
# otherwise HTTP-only. Override host cert dir with: DMM_SSL_CERTS_DIR=/path
#
# Auth: /api/* ALWAYS requires Authorization: Bearer <DMM_AUTH_TOKEN>.
# /proxy/* does NOT require a token. DMM_API_PROTECT only controls whether
# /proxy/* needs a signature:
#   on  (default): /api/* returns signed proxy URLs (?sig=&exp=), /proxy/* needs it
#   off          : /api/* returns plain proxy paths, /proxy/* fully open
# =============================================================================

version: "3.8"

services:
  dmm-proxy:
    image: fireinrain/dmm-proxy-api:latest
    container_name: dmm-proxy
    ports:
      - "${DMM_PROXY_PORT:-80}:80"
      - "${DMM_PROXY_SSL_PORT:-443}:443"
    environment:
      - DMM_AUTH_TOKEN=${DMM_AUTH_TOKEN}
      - DMM_API_PROTECT=${DMM_API_PROTECT:-on}
      - DMM_SIGN_TTL=${DMM_SIGN_TTL:-220}
      - DMM_RATE_PER_MIN=${DMM_RATE_PER_MIN:-240}
      - DMM_ALLOW_IPS=${DMM_ALLOW_IPS:-}
      - DMM_CERT_DIR=${DMM_CERT_DIR:-/etc/ssl/dmm}
      - DMM_CERT_FILE=${DMM_CERT_FILE:-fullchain.pem}
      - DMM_CERT_KEY=${DMM_CERT_KEY:-private.key}
    volumes:
      - ${DMM_SSL_CERTS_DIR:-./certs}:/etc/ssl/dmm:ro
    restart: unless-stopped
