    padding: 3px 10px;

    background: rgba(154,140,191,0.09);
    color: var(--text-light);
    border: 1px solid var(--border);
  }
  .sr-mchip.rate {
    color: #c9781a;
    background: rgba(240,180,90,0.14);
    border-color: rgba(240,180,90,0.42);
  }
  .sr-table {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    column-gap: 26px;
    row-gap: 6px;
    align-items: start;
    margin-top: 2px;
  }
  .sr-row {
    display: flex;
    font-size: 12.5px;
    line-height: 1.55;
    gap: 10px;
    min-width: 0;
  }
  .sr-label {
    flex: 0 0 88px;
    color: var(--text-light);
    flex-shrink: 0;
    font-weight: 600;
  }
  .sr-value {
    color: var(--text);
    word-break: break-word;
    min-width: 0;
  }
  .sr-chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 7px;
    margin: 1px 3px 1px 0;
    background: rgba(154,140,191,0.09);
    color: var(--primary-dark);
    border: 1px solid rgba(154,140,191,0.16);
  }
  .sr-desc {
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--text-light);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    border-left: 3px solid var(--border);
    padding-left: 10px;
  }
  .sr-desc.expanded {
    -webkit-line-clamp: unset;
    color: var(--text);
  }
  .sr-thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    margin-top: 2px;
  }
  .sr-thumbs img {
    width: 78px;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    cursor: zoom-in;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .sr-thumbs img:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(40,50,80,0.18);
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(61,64,91,0.1);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--border);
    display: block;
    cursor: zoom-in;
  }
  /* ---- gacha browse mode: blur covers + reveal effect ---- */
  body.browse-gacha .card {
    position: relative;
    cursor: pointer;
  }
  body.browse-gacha .card-img {
    filter: blur(26px) saturate(1.15);
    transform: scale(1.08);
    transition: filter .5s ease, transform .5s ease;
  }
  body.browse-gacha .card.revealed .card-img {
    animation: gachaFlip .8s ease forwards;
  }
  @keyframes gachaFlip {
    0%   { transform: perspective(800px) rotateY(0deg)   scale(1.08); filter: blur(26px) saturate(1.15); }
    30%  { transform: perspective(800px) rotateY(60deg)  scale(1.12); filter: blur(18px) saturate(1.3); }
    55%  { transform: perspective(800px) rotateY(110deg) scale(1.06); filter: blur(10px) saturate(1.2); }
    100% { transform: perspective(800px) rotateY(360deg) scale(1);    filter: none; }
  }
  body.browse-gacha .card.revealed::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 42%, rgba(255,235,160,.6) 50%, transparent 58%);
    animation: cardShine .8s ease forwards;
  }
  @keyframes cardShine {
    0%  { transform: translateX(-80%); opacity: 1; }
    70% { transform: translateX(80%);  opacity: 1; }
    100%{ transform: translateX(80%);  opacity: 0; }
  }
  .card-body {
    padding: 14px 16px 16px;
  }
  .card-rank {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(232,168,124,0.12);
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card-sub {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .card-id {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary-dark);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: color .15s, transform .15s;
  }
  .card-id:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
  .card-id.copied { color: var(--primary); }
  .code-toast {
    position: fixed;
    left: 50%;
    bottom: 72px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.82);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 2000;
    opacity: 0;
    transition: opacity .2s;
  }
  .code-toast.show { opacity: 1; }
  .card-date {
    font-size: 11px;
    color: var(--text-light);
    background: rgba(232,168,124,0.12);
    padding: 2px 8px;
    border-radius: 8px;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--text-light);
  }
  .card-tag {
    background: rgba(124,154,146,0.08);
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .card-tag.tag-genre {
    background: rgba(94,129,255,0.10);
    color: #8f9dff;
  }
  .card-tag.tag-label {
    background: rgba(255,157,94,0.10);
    color: #ffab80;
  }
  .card-price {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
  }
  .card-price .original {
    text-decoration: line-through;
    color: var(--text-light);
    font-weight: 400;
    margin-left: 4px;
    font-size: 11px;
  }

  /* ---- pagination ---- */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
  }
  .page-btn {
    padding: 6px 16px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary-dark);
  }
  .page-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  .page-info {
    font-size: 13px;
    color: var(--text-light);
    padding: 0 8px;
  }

  /* ---- favorites toolbar ---- */
  .fav-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    padding: 10px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .fav-toolbar input[type="text"] {
    flex: 1 1 190px;
    min-width: 150px;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .fav-toolbar input[type="text"]:focus { border-color: var(--primary); }
  .fav-tool-btn {
    padding: 6px 13px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .fav-tool-btn:hover { border-color: var(--primary); color: var(--primary-dark); }
  .fav-tool-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .fav-tool-btn.danger { color: #c04949; border-color: #e2b6b6; }
  .fav-tool-btn.danger:hover { border-color: #c04949; color: #c04949; }
  #fav-batch-del { display: none; }
  .fav-tool-btn.danger.show { display: inline-block; }
  .fav-tool-btn.danger:disabled { opacity: .45; cursor: not-allowed; }
  .fav-chk-all {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .fav-toolbar.batch .fav-chk-all { display: inline-flex; }
  .fav-chk-all input { accent-color: var(--primary); }

  /* ---- favorites card overlay (checkbox + remove) ---- */
  .fav-card { position: relative; }
  .fav-card-tools {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }
  .fav-card-tools > * { pointer-events: auto; }
  .fav-chk {
    display: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    box-shadow: 0 1px 5px rgba(0,0,0,.18);
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .fav-chk input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
  .fav-toolbar.batch ~ .cards .fav-chk,
  .fav-toolbar.batch .fav-chk { display: flex; }
  .fav-del {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 5px rgba(0,0,0,.25);
    transition: background .2s, transform .2s;
  }
  .fav-del:hover { background: #c04949; transform: scale(1.08); }

  /* ---- loading / empty ---- */
  .status-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* ---- footer / copyright ---- */
  .site-footer {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px 24px;
    font-size: 11px;
    color: var(--text-light);
    opacity: .8;
    user-select: none;
  }
  .site-note {
    text-align: center;
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--text-light);
    opacity: .85;
  }
  .site-footer-row {
    text-align: right;
  }
  .site-footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  .site-footer a:hover {
    color: var(--primary-dark);
  }

  /* ---- fade in ---- */
  .fade-in {
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn .2s ease;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: visible;
    max-width: 960px;
    width: 92vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .modal-img-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    overflow: hidden;
    border-radius: 16px 16px 0 0;
  }
  .modal-img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .modal-img-wrap { cursor: zoom-in; }
  .modal-loupe {
    position: absolute;
    top: 0;
    left: 0;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .85);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .12);
    background-repeat: no-repeat;
    background-position: 0 0;
    pointer-events: none;
    display: none;
    z-index: 6;
  }
  .modal-loupe.on { display: block; }
  .modal-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.85);
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, transform .15s;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    z-index: 2;
  }
  .modal-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.08); }
  .modal-arrow.left  { left: 12px; }
  .modal-arrow.right { right: 12px; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.85);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: background .2s;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .modal-close:hover { background: #fff; }
  .modal-footer {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
    border-radius: 0 0 16px 16px;
  }
  .modal-counter {
    font-size: 13px;
    color: var(--text-light);
    min-width: 60px;
  }
  .modal-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .modal-sub {
    font-size: 11px;
    color: var(--text-light);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .modal-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: rgba(124,154,146,0.1);
    color: var(--primary-dark);
    white-space: nowrap;
  }

  /* ---- modal action buttons (magnet / play) ---- */
  .modal-footer {
    position: relative;
  }
  .action-bar {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--primary-light);
    background: var(--card-bg);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .action-btn:hover:not(:disabled) {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .action-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  /* favorite heart button: fills with the active theme's primary color */
  .action-btn.fav-btn.active {
    background: transparent;
    color: var(--primary-dark);
    border-color: var(--primary-light);
    border-width: 1.5px;
  }
  .action-btn.fav-btn .action-ico {
    font-size: 13px;
    line-height: 1.2;
  }
  .action-btn.fav-btn.active .action-ico {
    color: var(--primary-dark);
  }
  .action-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
  }
  .action-ico {
    font-size: 12px;
    line-height: 1;
  }
  .action-ico.spin {
    display: inline-block;
    animation: spin .9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .action-popover {
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    width: min(430px, calc(100vw - 40px));
    max-height: 55vh;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0,0,0,.18);
    z-index: 60;
    padding: 8px;
    display: none;
  }
  .action-popover.open {
    display: block;
  }
  .ap-status {
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
    padding: 18px 12px;
  }
  .ap-retry {
    display: block;
    margin: 0 auto 14px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--bg);
    border: 1px solid var(--primary);
    border-radius: 16px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .ap-retry:hover { background: var(--primary); color: #fff; }
  .ap-tab.busy { opacity: .5; pointer-events: none; }
  .ap-status.ap-state-loading { color: var(--text-light); }
  .ap-group + .ap-group {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .ap-head {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary-dark);
    letter-spacing: .3px;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  .ap-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.45;
    text-decoration: none;
    color: var(--text);
    transition: background .15s;
  }
  .ap-row:hover {
    background: var(--primary-light);
  }
  a.ap-row:hover {
    color: var(--text);
  }
  .ap-magnet {
    cursor: pointer;
    flex-direction: column;
    align-items: stretch;
  }
  .ap-name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .ap-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .ap-copy {
    flex-shrink: 0;
    padding: 2px 10px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    transition: background .2s;
  }
  .ap-copy.done {
    background: var(--primary-dark);
  }
  .ap-badge {
    flex-shrink: 0;
    font-size: 11px;
    border-radius: 8px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .ap-badge.ok   { background: rgba(124,180,146,.15); color: var(--primary-dark); }
  .ap-badge.no   { background: rgba(200,120,120,.12); color: var(--accent); }
  .ap-badge.warn { background: rgba(232,168,124,.15); color: var(--accent); }
  .ap-sub {
    font-size: 11px;
    color: var(--text-light);
    padding: 2px 4px 0;
  }

  /* ---- magnet tabs / tags / hint ---- */
  .ap-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .ap-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 8px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-light);
    font-size: 11px;
    cursor: pointer;
    transition: all .15s;
  }
  .ap-tab:hover {
    border-color: var(--primary-light);
    color: var(--primary-dark);
  }
  .ap-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }
  .ap-tab-cnt {
    font-size: 10px;
    opacity: .8;
  }
  .ap-pane { display: none; }
  .ap-pane.active { display: block; }
  .ap-tag-line {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .ap-tag {
    display: inline-block;
    font-size: 10px;
    line-height: 1.6;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(124,154,146,.1);
    color: var(--text-light);
  }
  .ap-tag.hd { background: rgba(124,180,146,.16); color: var(--primary-dark); }
  .ap-tag.co { background: rgba(91,152,184,.16); color: #3a7494; }

// ========== Frontend session token ==========
// The browser never holds the master DMM_AUTH_TOKEN. /api/session issues a
// short-lived (FRONTEND_TTL), client-IP-bound token; we refresh it lazily.
let __API_TOKEN__ = '';
let __TOKEN_EXP__ = 0;

async function refreshSession(force) {
  if (!force && __API_TOKEN__ && (__TOKEN_EXP__ - Date.now() / 1000) > 30) return;
  const r = await fetch('/api/session', { cache: 'no-store', headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('session ' + r.status);
  const d = await r.json();
  __API_TOKEN__ = d.token || '';
  __TOKEN_EXP__ = d.exp || 0;
}

// ========== Theme ==========
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  renderThemeDropdown();
}

function renderThemeDropdown() {
  const el = document.getElementById('theme-dropdown');
  const lang = currentLang;
  el.innerHTML = THEMES.map(th => {
    const name = lang === 'zh' ? th.name_zh : th.name_en;
    const active = th.id === currentTheme ? ' active' : '';
    return `<button class="theme-option${active}" onclick="setTheme('${th.id}')">
      <span class="theme-dot" style="background:${th.color}"></span>
      ${name}

  }).join('');

  currentTheme = id;

  document.getElementById('theme-dropdown').classList.toggle('open');

function applyBrowse() {
  const gacha = currentBrowse === 'gacha';
  document.body.classList.toggle('browse-gacha', gacha);
  document.getElementById('btn-browse').classList.toggle('active', gacha);
  document.getElementById('browse-label').textContent = gacha ? '我抽卡' : '随便看';
  document.getElementById('browse-icon').textContent = gacha ? '🎰' : '👀';
}

function toggleBrowseMode() {
  currentBrowse = currentBrowse === 'gacha' ? 'browse' : 'gacha';
  localStorage.setItem('browse', currentBrowse);
  applyBrowse();
  resetGachaCards();
}

function handleCardClick(e, card, payload) {
  // Gacha reveal only applies to the browse-mode cards, never to search results.
  if (currentBrowse === 'gacha' && card.classList.contains('card') && !card.classList.contains('revealed')) {
    card.classList.add('revealed');
    return;
  }
  // Only the cover image opens the browser; clicking the title, meta or
  // elsewhere on the card does nothing. Search results use .sr-cover-img,
  // the browse grid uses .card-img.
  if (!e.target.closest('.card-img') && !e.target.closest('.sr-cover-img')) return;
  openModal(payload);
}

function resetGachaCards() {
  document.querySelectorAll('#cards .card').forEach(card => {
    card.classList.remove('revealed');
  });
}

document.addEventListener('click', e => {

  if (!picker.contains(e.target)) {
    document.getElementById('theme-dropdown').classList.remove('open');
  }
});

// Map API work → frontend format (sampleImages → images for modal)
function mapWork(w, source) {
  const isJavbus = String(source || '').toLowerCase() === 'javbus';
  const images = [];
  // javbus covers (www.javbus.com/pics/...) are CORS-blocked in the browser;
  // skip them in the modal (the card shows a local placeholder instead).
  if (!isJavbus && w.cover && w.cover.large) {
    images.push({ type: 'cover', url: w.cover.large });
  }
  if (!isJavbus && w.cover && w.cover.medium) {
    images.push({ type: 'cover', url: w.cover.medium });
  }
  if (w.sampleImages && w.sampleImages.length) {
    w.sampleImages.forEach(s => {
      if (s.largeUrl) images.push({ type: 'sample', url: s.largeUrl });
    });
  }
  return Object.assign({}, w, { images });
}

function mapResponse(data) {
  if (!data || !data.works) return data;
  return Object.assign({}, data, {
    works: data.works.map(w => mapWork(w, data.source)),
  });
}

// One result spans 2 grid cells: a medium cover on the left and an
// itemized detail list on the right (番号, dates, actresses, 監督, maker, ...),
// mirroring the DMM product page instead of the daily-update card grid.

function fmtJstDate(s) {
  if (!s) return '';
  const str = String(s).trim();
  if (/Z$/.test(str)) {
    const d = new Date(str);
    if (isNaN(d.getTime())) return str.slice(0, 10).replace(/-/g, '/');
    const j = new Date(d.getTime() + 9 * 3600 * 1000);
    const p = n => String(n).padStart(2, '0');
    return `${j.getUTCFullYear()}/${p(j.getUTCMonth() + 1)}/${p(j.getUTCDate())}`;
  }
  return str.slice(0, 10).replace(/-/g, '/');
}

function renderSearchResult(data) {
  const container = document.getElementById('cards');
  const titleEl = document.getElementById('content-title');
  const countEl = document.getElementById('content-count');

  if (!data || !data.works || data.works.length === 0) {
    container.innerHTML = `<div class="status-msg">${t('no_data')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  if (data.keyword) titleEl.textContent = t('search_title', data.keyword);
  countEl.textContent = t('total', data.total);
  container.innerHTML = data.works.map((w, i) => renderSearchItem(w, i, data.source)).join('');
  renderPagination(data);
}

  const isMgs    = String(source || '').toLowerCase() === 'mgs';

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getRecentDates() {
  const dates = [];
  const now = new Date();
  const todayStr = fmtDate(now);
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    dates.push(fmtDate(d));
  }
  return { dates, todayStr };
}
let DATES = getRecentDates().dates;
const TODAY = getRecentDates().todayStr;

// drag-to-scroll + forceful-fling to reveal earlier months
let dragStartX = 0, dragScrollLeft = 0, dragging = false, dragged = false;
let lastMoveX = 0, lastMoveT = 0, flingV = 0, peakOverscroll = 0;
const FLING_V         = 0.6;   // px/ms – minimum velocity to trigger extend
const OVERSCROLL_PX   = 60;    // pulling past the left edge by this much triggers extend
const EXTEND_DAYS     = 30;    // days prepended per fling (≈ one month)
const MAX_BACK_DAYS   = 365;   // hard cap: never go back more than one year

function extendTimelineBack() {
  const track = document.getElementById('timeline-track');
  const oldest = DATES[0];
  if (!oldest || !track.firstElementChild) return false;
  const daysBack = Math.floor((new Date(TODAY + 'T00:00:00') - new Date(oldest + 'T00:00:00')) / 86400000);
  if (daysBack + 1 >= MAX_BACK_DAYS) return false;
  const add = Math.min(EXTEND_DAYS, MAX_BACK_DAYS - (daysBack + 1));
  if (add <= 0) return false;

  const added = [];
  const base = new Date(oldest + 'T00:00:00').getTime();
  for (let i = 1; i <= add; i++) {
    added.push(fmtDate(new Date(base - i * 86400000)));
  }
  added.reverse(); // chronological, all strictly older than `oldest`

  const oldScrollLeft = track.scrollLeft;
  const step = track.firstElementChild.offsetWidth +
    (parseFloat(getComputedStyle(track).gap) || 0);
  DATES = added.concat(DATES);
  currentDateIdx += added.length;

  // Prevent scroll-behavior:smooth from animating the scrollLeft adjustment
  track.style.scrollBehavior = 'auto';
  renderTrack();
  track.scrollLeft = oldScrollLeft + added.length * step;
  track.style.scrollBehavior = '';
  return true;
}

function initDrag() {
  const track = document.getElementById('timeline-track');
  track.addEventListener('pointerdown', e => {
    dragging = true;
    dragged = false;
    dragStartX = e.clientX;
    dragScrollLeft = track.scrollLeft;
    lastMoveX = e.clientX;
    lastMoveT = performance.now();
    flingV = 0;
    peakOverscroll = 0;
    track.style.transform = '';
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    const maxScroll = track.scrollWidth - track.clientWidth;
    let overscroll = 0;
    if (Math.abs(dx) > 5) {
      dragged = true;
      const requested = dragScrollLeft - dx;
      if (requested < 0) {
        // pulled past the left edge – clamp and record the overscroll (peak)
        track.scrollLeft = 0;
        overscroll = -requested;
      } else {
        track.scrollLeft = Math.min(requested, maxScroll);
      }
      if (overscroll > peakOverscroll) peakOverscroll = overscroll;
      // rubber-band visual: shift the dates right while pulling past the edge
      const tx = peakOverscroll > 0 ? Math.min(peakOverscroll, 90) * 0.35 : 0;
      track.style.transform = `translateX(${tx}px)`;
    }
    const t = performance.now();
    const dPx = e.clientX - lastMoveX;
    const dT  = Math.max(t - lastMoveT, 1);
    flingV = dPx / dT;
    lastMoveX = e.clientX;
    lastMoveT = t;
  });
  const maybeFling = () => {
    // extend when (a) the release was a fast rightward fling at the oldest
    // edge, or (b) the user slowly pulled past the left edge (overscroll)
    // by a good margin – both mean "show me an earlier month".
    const atEdge = track.scrollLeft <= 1;
    if (dragged && atEdge &&
        (flingV > FLING_V || peakOverscroll >= OVERSCROLL_PX)) {
      extendTimelineBack();
    }
    track.style.transform = '';
    dragScrollLeft = 0;
    lastMoveX = 0;
    lastMoveT = 0;
    peakOverscroll = 0;
    dragging = false;
    dragged  = false;
    flingV   = 0;
  };
  window.addEventListener('pointerup', maybeFling);
  window.addEventListener('pointercancel', maybeFling);

  // suppress the click that follows a real drag, so day selection still works
  track.addEventListener('click', e => {
    if (dragged) {
      e.stopPropagation();
      e.preventDefault();
      dragged = false;
    }
  }, true);
}

// Native <input type="date"> pickers anchor themselves wherever the browser

let calViewYear = 0, calViewMonth = 0; // viewport year/month (1-12) shown

function calMove(dir) {

function calJump(dir) {

function renderCalendar() {

    const future = val > TODAY;

// Accepts YYYY-MM-DD, YYYYMMDD, or YYYY-M-D; Enter/change picks the date.
function onCpInputKey(e) {
  if (e.key === 'Enter') pickTypedDate();
}
function pickTypedDate() {
  const input = document.getElementById('cp-date-input');
  const raw = (input.value || '').trim();
  if (!raw) return;
  const val = parseDateInput(raw);
  if (!val) { input.select(); return; }
  if (val > TODAY) { input.select(); return; }
  closeCalendar();
  if (!DATES.includes(val)) {
    DATES.push(val);
    DATES.sort();
  }
  currentDateIdx = DATES.indexOf(val);
  currentPage = 0;
  renderTimeline();
  syncModeButtons();
  loadTodayData();
  updateHash();
}
function parseDateInput(s) {
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  let Y, MO, D;
  if (m) {
    Y = +m[1]; MO = +m[2]; D = +m[3];
  } else {
    m = s.match(/^(\d{8})$/);
    if (!m) return null;
    Y = +s.slice(0, 4); MO = +s.slice(4, 6); D = +s.slice(6, 8);
  }
  const dt = new Date(Y, MO - 1, D);
  if (dt.getFullYear() !== Y || dt.getMonth() !== MO - 1 || dt.getDate() !== D) return null;
  return `${Y}-${String(MO).padStart(2, '0')}-${String(D).padStart(2, '0')}`;
}

// ========== Modal Loupe (magnifier) ==========
// CSS background-image loupe: reuses the already-loaded sample/cover image so
// no extra download, no CORS taint, and sub-pixel precision. Follows the mouse
// inside the *painted* area under `object-fit: contain` (letterbox bars hide it).
const LOUPE_SIZE = 190;
const LOUPE_ZOOM = 2.5;

function loupeHide() {
  const lens = document.getElementById('modal-loupe');
  if (lens) lens.classList.remove('on');
}

function loupeMove(e) {
  const wrap = document.getElementById('modal-img-wrap');
  const img = document.getElementById('modal-img');
  const lens = document.getElementById('modal-loupe');
  if (!wrap || !img || !lens || !img.src || !img.naturalWidth) { loupeHide(); return; }

  const src = img.src;
  if (lens.style.backgroundImage !== `url("${src}")`) {
    lens.style.backgroundImage = `url("${src}")`;
  }

  const iw = img.naturalWidth, ih = img.naturalHeight;
  const r = img.getBoundingClientRect();
  const scale = Math.min(r.width / iw, r.height / ih);
  const pw = iw * scale, ph = ih * scale;
  const ox = r.left + (r.width - pw) / 2;
  const oy = r.top + (r.height - ph) / 2;

  const mx = e.clientX - ox;
  const my = e.clientY - oy;
  if (mx < 0 || my < 0 || mx > pw || my > ph) { loupeHide(); return; }

  lens.classList.add('on');
  const wr = wrap.getBoundingClientRect();
  lens.style.left = (e.clientX - wr.left - LOUPE_SIZE / 2) + 'px';
  lens.style.top = (e.clientY - wr.top - LOUPE_SIZE / 2) + 'px';
  lens.style.backgroundSize = (pw * LOUPE_ZOOM) + 'px ' + (ph * LOUPE_ZOOM) + 'px';
  lens.style.backgroundPosition = (-(mx * LOUPE_ZOOM - LOUPE_SIZE / 2)) + 'px ' + (-(my * LOUPE_ZOOM - LOUPE_SIZE / 2)) + 'px';
}

(function loupeBind() {
  const wrap = document.getElementById('modal-img-wrap');
  if (!wrap) return;
  wrap.addEventListener('mousemove', loupeMove);
  wrap.addEventListener('mouseleave', loupeHide);
})();

async function actionFetch(url) {
  await refreshSession();
  let res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
  if (res.status === 401 || res.status === 403) {
    await refreshSession(true);
    res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
  }
  if (!res.ok) throw new Error('API ' + res.status);
  return res.json();
}

async function loadMagnets() {
  if (fetching) return;
  fetching = true;
  setBusy('btn-magnet', true);
  const po = document.getElementById('action-popover');
  try {
    const data = await actionFetch(`/api/magnet/${encodeURIComponent(currentCode)}`);
    magnetData = data.sources || [];
    renderMagnetTabs();
  } catch (e) {
    po.innerHTML = `<div class="ap-status">${t('load_failed')}</div>`;
  } finally {
    fetching = false;
    setBusy('btn-magnet', false);
  }
}

async function retryMagnetChannel(i) {
  const src = magnetData[i];
  if (!src) return;
  const pane = document.getElementById('ap-pane-' + i);
  if (pane) pane.innerHTML = `<div class="ap-state-loading ap-status">${t('loading')}</div>`;
  const btn = document.querySelector(`#action-popover .ap-tab[data-idx="${i}"]`);
  if (btn) btn.classList.add('busy');
  try {
    const data = await actionFetch(`/api/magnet/${encodeURIComponent(currentCode)}?s=${encodeURIComponent(src.source)}`);
    const fresh = (data.sources || []).find(x => String(x.source).toLowerCase() === String(src.source).toLowerCase());
    magnetData[i] = fresh || src;
    renderMagnetPane(i);
  } catch (e) {
    if (pane) pane.innerHTML = `<div class="ap-status">${t('load_failed')}</div>` +
      `<button class="ap-retry" onclick="retryMagnetChannel(${i})">${t('retry_channel')}</button>`;
  } finally {
    if (btn) btn.classList.remove('busy');
  }
}

async function renderMagnetTabs() {
  const po = document.getElementById('action-popover');
  const anyMagnet = magnetData.some(s => Array.isArray(s.magnets) && s.magnets.length > 0);
  if (!magnetData.length || !anyMagnet) {
    po.innerHTML = `<div class="ap-status">${t('magnet_none')}</div>` +
      `<button class="ap-retry" onclick="loadMagnets()">${t('retry_channel')}</button>`;
    return;
  }
  const tabs = magnetData.map((s, i) =>
    `<button class="ap-tab${i === 0 ? ' active' : ''}" data-idx="${i}" onclick="selectMagnetTab(${i})">${escHtml(String(s.source || '').toUpperCase())}<span class="ap-tab-cnt">${s.count != null ? s.count : (s.magnets || []).length}</span></button>`
  ).join('');
  po.innerHTML = `<div class="ap-tabs">${tabs}</div>` +
    magnetData.map((_, i) => `<div class="ap-pane${i === 0 ? ' active' : ''}" id="ap-pane-${i}"></div>`).join('');
  magnetData.forEach((_, i) => renderMagnetPane(i));
}

function selectMagnetTab(i) {
  document.querySelectorAll('#action-popover .ap-tab').forEach((b, k) => b.classList.toggle('active', k === i));
  document.querySelectorAll('#action-popover .ap-pane').forEach((p, k) => p.classList.toggle('active', k === i));
}

function renderMagnetPane(i) {
  const src = magnetData[i];
  const pane = document.getElementById('ap-pane-' + i);
  const mags = Array.isArray(src.magnets) ? src.magnets.slice() : [];
  mags.sort((a, b) => dateVal(b) - dateVal(a));
  if (!mags.length) {
    pane.innerHTML = `<div class="ap-status">${escHtml(src.error || t('magnet_none'))}</div>` +
      `<button class="ap-retry" onclick="retryMagnetChannel(${i})">${t('retry_channel')}</button>`;

  });

function dateVal(m) {
  const ts = +m.date;
  if (m.date === ts) return ts;
  const n = parseInt(String(m.date_str || m.date || '').replace(/[^\d]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

const HD_PATTERNS = [
  { re: /\b4K\b|\b2160p\b|\bUHD\b/i, text: '4K', cls: 'hd' },
  { re: /\b1080p\b|\bFHD\b/i, text: '1080p', cls: 'hd' },
  { re: /\b720p\b/i, text: '720p', cls: 'tx' },
  { re: /\bH265\b|\bHEVC\b|\bHVC\b/i, text: 'H265', cls: 'co' },
  { re: /\bH264\b|\bAVC\b/i, text: 'H264', cls: 'co' },
  { re: /\bBlu[- ]?ray\b/i, text: 'BD', cls: 'co' },
];

function hdTags(name, extraTags) {
  const s = String(name || '');
  const seen = {};
  const out = [];
  for (const p of HD_PATTERNS) {
    if (p.re.test(s) && !seen[p.text]) { seen[p.text] = 1; out.push({ text: p.text, cls: p.cls }); }
  }
  if (Array.isArray(extraTags)) {
    for (const tg of extraTags) {
      const tx = String(tg).trim();
      if (tx && !seen[tx]) { seen[tx] = 1; out.push({ text: tx, cls: 'hd' }); }
    }
  }
  return out.slice(0, 4);
}

function magnetRow(m) {
  const tags = hdTags(m.name, m.tags);
  const tagHtml = tags.map(tg => `<span class="ap-tag ${tg.cls}">${escHtml(tg.text)}</span>`).join('');
  const files = m.files != null && m.files > 0 ? `${m.files} ${t('files')}` : '—';
  return `
    <div class="ap-row ap-magnet" data-magnet="${escAttr(m.magnet)}">
      <div class="ap-name">${escHtml(m.name)}</div>
      ${tagHtml ? `<div class="ap-tag-line">${tagHtml}</div>` : ''}
      <div class="ap-meta">
        <span>${escHtml(m.size || '')}</span>
        <span>${escHtml(files)}</span>
        <span>${escHtml(m.date_str || '')}</span>
        <span class="ap-copy">${t('copy')}</span>
      </div>
    </div>`;
}

function copyMagnet(magnet, rowEl) {
  const badge = rowEl.querySelector('.ap-copy');
  const done = () => {
    badge.classList.add('done');
    badge.textContent = t('copied');
    setTimeout(() => { badge.classList.remove('done'); badge.textContent = t('copy'); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = magnet;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (_) { window.prompt(t('copy'), magnet); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(magnet).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer = null;
function showCopyToast(msg) {
  let el = document.getElementById('code-toast');
  if (!el) {
    el = document.createElement('div');

    el.className = 'code-toast';
    document.body.appendChild(el);

// Click a 番号 (works list or modal footer) to copy it to the clipboard.
function copyCode(el) {
  const code = String(el.dataset.code || el.textContent || '').trim();
  if (!code) return;
  const done = () => {
    el.classList.add('copied');
    showCopyToast(t('copied'));
    setTimeout(() => el.classList.remove('copied'), 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(done).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
      done();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
    done();
  }
}

// ========== Favorites (IndexedDB) ==========
// Stored in IndexedDB (`works` store, keyPath=番号 code) as self-contained
// records: title/code/date/actresses for search, cover + images URLs so the
// modal can be reopened and the grid can show a thumbnail. Only URLs are kept,
// never image bytes. A read cache (`favorites`) mirrors the store for cheap
// search/filter/pagination; every mutation writes through to IndexedDB.
const FAV_DB_NAME = 'dm9_favs_db';
const FAV_DB_VERSION = 1;
const FAV_STORE = 'works';
const FAV_LEGACY_KEY = 'dm9_favs'; // pre-IndexedDB localStorage key, migrated once
const FAV_PAGE_SIZE = 20;

let favorites = [];          // full cache, newest first
let favLoaded = false;       // IDB opened + cache populated
let favQuery = '';           // keyword filter (title / actresses / code)
let favPage = 0;             // 0-based current page (favorites view)
let favBatch = false;        // batch-select mode
let favSelected = new Set(); // codes selected for batch delete

// IndexedDB access via the `idb` library (vendored at static/lib/idb.min.js).
// The connection is opened once and shared; `favGetAll`/`favPutAll`/... use
// idb's promise wrappers instead of hand-rolled transaction callbacks.
let _favDBPromise = null;

function favDB() {
  if (!_favDBPromise) {
    if (typeof idb === 'undefined') {
      _favDBPromise = Promise.reject(new Error('idb library unavailable'));
    } else {
      _favDBPromise = idb.openDB(FAV_DB_NAME, FAV_DB_VERSION, {
        upgrade(db) {
          if (!db.objectStoreNames.contains(FAV_STORE)) {
            db.createObjectStore(FAV_STORE, { keyPath: 'code' });
          }
        },
      });
      _favDBPromise.catch(() => { _favDBPromise = null; });
    }
  }
  return _favDBPromise;
}

async function favGetAll() {
  const db = await favDB();
  return db.getAll(FAV_STORE);
}

async function favPutAll(records) {
  if (!records.length) return;
  const db = await favDB();
  const tx = db.transaction(FAV_STORE, 'readwrite');
  await Promise.all(records.map(r => tx.store.put(r)));
  await tx.done;
}

async function favDeleteAll(codes) {
  if (!codes.length) return;
  const db = await favDB();
  const tx = db.transaction(FAV_STORE, 'readwrite');
  await Promise.all(codes.map(c => tx.store.delete(c)));
  await tx.done;
}

async function favClearStore() {
  const db = await favDB();
  await db.clear(FAV_STORE);
}

// Open the DB, migrate any legacy localStorage data, populate the cache.
async function loadFavorites() {
  favorFavoritesFallback();
  try {
    let records = await favGetAll();
    if (!records.length) {
      let legacy = [];
      try { legacy = JSON.parse(localStorage.getItem(FAV_LEGACY_KEY) || '[]'); } catch (e) { legacy = []; }
      if (Array.isArray(legacy) && legacy.some(r => r && r.code)) {
        const clean = legacy.filter(r => r && r.code).map(normalizeFav);
        await favPutAll(clean);
        records = await favGetAll();
      }
      localStorage.removeItem(FAV_LEGACY_KEY);
    }
    favorites = records.map(normalizeFav).sort(favSortNewest);
  } catch (e) {
    console.warn('IndexedDB unavailable, falling back to localStorage:', e);
    favorFavoritesFallback();
  }
  favLoaded = true;
  if (currentMode === 'fav') renderFavorites();
}

function favorFavoritesFallback() {
  try {
    favorites = JSON.parse(localStorage.getItem(FAV_LEGACY_KEY) || '[]')
      .filter(r => r && r.code).map(normalizeFav).sort(favSortNewest);
  } catch (e) { favorites = []; }
}

function favSortNewest(a, b) { return (b.addedAt || 0) - (a.addedAt || 0); }

function normalizeFav(r) {
  return {
    code: String(r.code || ''),
    title: r.title || '',
    date: r.date || '',
    actresses: r.actresses || '',
    cover: (r.cover && !String(r.cover).startsWith('data:')) ? String(r.cover) : '',
    images: Array.isArray(r.images) ? r.images.map(i => ({ type: i && i.type, url: i && i.url })).filter(i => i.url) : [],
    addedAt: r.addedAt || 0,
  };
}

function isFavorited(code) {
  return !!code && favorites.some(f => f.code === code);
}

function refreshFavButton() {
  const btn = document.getElementById('btn-fav');
  btn.disabled = !currentCode;
  const on = isFavorited(currentCode);
  btn.classList.toggle('active', on);
  const ico = btn.querySelector('.action-ico');
  ico.textContent = on ? '♥' : '♡';
  const lbl = btn.querySelector('.action-lbl');
  lbl.textContent = on ? t('fav_saved') : (currentCode ? t('fav_btn') : t('fav_nofav'));
}

function toggleFav() {
  if (!currentCode) return;
  const existing = favorites.find(f => f.code === currentCode);
  if (existing) {
    favorites = favorites.filter(f => f.code !== currentCode);
    refreshFavButton();
    renderFavIfVisible();
    favDeleteAll([currentCode]).catch(e => console.warn('fav delete:', e));
    return;
  }
  const w = currentModalWork || {};
  const cv = (w.cover && (w.cover.medium || w.cover.large)) || w.coverUrl || '';
  const rec = normalizeFav({
    code: currentCode,
    title: w.title || '',
    date: w.date || '',
    actresses: w.actresses || '',
    cover: cv,
    images: Array.isArray(w.images) ? w.images.map(img => ({ type: img.type, url: img.url })) : [],
    addedAt: Date.now(),
  });
  favorites.unshift(rec);
  favPutAll([rec]).catch(e => console.warn('fav put:', e));
  refreshFavButton();
  renderFavIfVisible();
}

function renderFavIfVisible() {
  if (currentMode === 'fav') renderFavorites();
  updateFavToolbarVisible();
}

function showFavorites() {
  if (currentMode === 'fav') {
    if (favReturnMode === 'search') {
      document.getElementById('search-input').value = favReturnSearch;
      currentSearch = favReturnSearch;
      updateSearchClear();
      switchMode('search');
      return;
    }
    switchMode(favReturnMode && favReturnMode !== 'fav' ? favReturnMode : 'today');
    return;
  }
  favReturnMode = currentMode;
  favReturnSearch = currentSearch;
  switchMode('fav');
}

// Whether a favorite matches the keyword query (case-insensitive) across
// 番号, title and actress names.
function favMatches(f, q) {
  const hay = `${f.code || ''} ${f.title || ''} ${f.actresses || ''}`.toLowerCase();
  return hay.indexOf(q) !== -1;
}

function favFiltered() {
  const q = favQuery.trim().toLowerCase();
  return q ? favorites.filter(f => favMatches(f, q)) : favorites.slice();
}

// The favorites grid reuses the card markup (card-img / card-body) plus a
// checkbox (batch mode) and a per-card remove button in the top corner.
function renderFavorites() {
  const container = document.getElementById('cards');
  const titleEl = document.getElementById('content-title');
  const countEl = document.getElementById('content-count');
  const pagEl = document.getElementById('pagination');

  if (!favLoaded) {
    container.innerHTML = `<div class="status-msg">${t('loading')}</div>`;
    pagEl.innerHTML = '';
    return;
  }

  const q = favQuery.trim().toLowerCase();
  const filtered = favFiltered();
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / FAV_PAGE_SIZE));
  if (favPage > pages - 1) favPage = Math.max(0, pages - 1);
  const start = favPage * FAV_PAGE_SIZE;
  const pageItems = filtered.slice(start, start + FAV_PAGE_SIZE);

  titleEl.textContent = t('fav_title');
  countEl.textContent = t('total', total);

  if (total === 0) {
    container.innerHTML = `<div class="status-msg">${q ? t('fav_no_match') : t('no_fav')}</div>`;
    pagEl.innerHTML = '';
    return;
  }

  container.innerHTML = pageItems.map((f, i) => {
    const code = f.code || '';
    const qc = escAttr(JSON.stringify(code));
    const payload = { images: f.images || [], title: f.title || '', code, date: f.date || '',
                      coverUrl: f.cover || '', actresses: f.actresses || '' };
    return `
      <div class="card fav-card fade-in" style="animation-delay:${i*30}ms"
        onclick="handleCardClick(event, this, ${escAttr(JSON.stringify(payload))})">
        <div class="fav-card-tools">
          <label class="fav-chk" title="${escAttr(t('fav_batch'))}">
            <input type="checkbox" ${favSelected.has(code) ? 'checked' : ''} onchange="favToggleSelect(${qc}, this.checked)">
          </label>
          <button class="fav-del" title="${escAttr(t('fav_del_one'))}" onclick="event.stopPropagation();favDeleteOne(${qc})">✕</button>
        </div>
        <img class="card-img" src="${escAttr(f.cover || '')}" alt="${escAttr(f.title || '')}" loading="lazy"
          onerror="this.style.background='linear-gradient(135deg,var(--border),var(--border))'">
        <div class="card-body">
          <div class="card-title">${escHtml(f.title || '')}</div>
          <div class="card-sub">
            ${code ? `<span class="card-id" data-code="${escAttr(code)}" title="${escAttr(t('copy'))}">${escHtml(code)}</span>` : ''}
            ${f.date ? `<span class="card-date">${escHtml(f.date.replace(/-/g, '/'))}</span>` : ''}
          </div>
          ${f.actresses ? `<div class="card-meta"><span class="card-tag">${escHtml(f.actresses)}</span></div>` : ''}
        </div>
      </div>`;
  }).join('');

  const allPageSelected = pageItems.length > 0 && pageItems.every(f => favSelected.has(f.code));
  const selAll = document.querySelector('#fav-chk-all input');
  if (selAll) selAll.checked = allPageSelected;

  renderFavPagination(total);
}

function renderFavPagination(total) {
  const el = document.getElementById('pagination');
  const pages = Math.max(1, Math.ceil(total / FAV_PAGE_SIZE));
  el.innerHTML = `
    <button class="page-btn" onclick="favPrevPage()" ${favPage === 0 ? 'disabled' : ''}>${t('prev')}</button>
    <span class="page-info">${favPage + 1} / ${pages}</span>
    <button class="page-btn" onclick="favNextPage()" ${favPage >= pages - 1 ? 'disabled' : ''}>${t('next')}</button>`;
}

function favPrevPage() { if (favPage > 0) { favPage--; renderFavorites(); } }
function favNextPage() { if (favPage * FAV_PAGE_SIZE + FAV_PAGE_SIZE < favFiltered().length) { favPage++; renderFavorites(); } }

let _favSearchTimer = 0;
function favSearch(v) {
  clearTimeout(_favSearchTimer);
  _favSearchTimer = setTimeout(() => {
    favQuery = v || '';
    favPage = 0;
    favSelected.clear();
    renderFavorites();
    updateFavToolbarUi();
  }, 200);
}

async function favDeleteOne(code) {
  if (!confirm(t('fav_del_one_confirm', code))) return;
  favorites = favorites.filter(f => f.code !== code);
  favSelected.delete(code);
  renderFavorites();
  updateFavToolbarUi();
  try { await favDeleteAll([code]); } catch (e) { console.warn('fav delete:', e); }
}

function favToggleBatch() {
  favBatch = !favBatch;
  if (!favBatch) favSelected.clear();
  renderFavorites();
  updateFavToolbarUi();
}

function favToggleSelect(code, on) {
  if (on) favSelected.add(code); else favSelected.delete(code);
  updateFavToolbarUi();
}

function favToggleSelectPage(checked) {
  const q = favQuery.trim().toLowerCase();
  const filtered = favFiltered();
  const start = favPage * FAV_PAGE_SIZE;
  filtered.slice(start, start + FAV_PAGE_SIZE).forEach(f => {
    if (checked) favSelected.add(f.code); else favSelected.delete(f.code);
  });
  renderFavorites();
  updateFavToolbarUi();
}

async function favDeleteSelected() {
  if (!favSelected.size) return;
  const codes = Array.from(favSelected);
  favorites = favorites.filter(f => !favSelected.has(f.code));
  favSelected.clear();
  favBatch = false;
  renderFavorites();
  updateFavToolbarUi();
  try { await favDeleteAll(codes); } catch (e) { console.warn('fav delete:', e); }
}

async function favClearAll() {
  if (!confirm(t('fav_clear_confirm'))) return;
  favorites = [];
  favSelected.clear();
  favPage = 0;
  favQuery = '';
  const input = document.getElementById('fav-search-input');
  if (input) input.value = '';
  renderFavorites();
  updateFavToolbarUi();
  try { await favClearStore(); } catch (e) { console.warn('fav clear:', e); }
}

// --- import / export ---
function favImportTrigger() {
  document.getElementById('fav-import-file').click();
}

async function favImportFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const arr = JSON.parse(text);
    if (!Array.isArray(arr)) throw new Error('not an array');
    const valid = arr.filter(r => r && r.code);
    if (!valid.length) { alert(t('fav_import_empty')); return; }
    const imports = valid.map(r => normalizeFav({ ...r, addedAt: r.addedAt || Date.now() }));
    await favPutAll(imports);
    favorites = (await favGetAll()).map(normalizeFav).sort(favSortNewest);
    favPage = 0;
    renderFavorites();
    updateFavToolbarUi();
    alert(t('fav_import_ok', imports.length));
  } catch (err) {
    console.warn('fav import:', err);
    alert(t('fav_import_fail'));
  }
}

function favExport() {
  if (!favorites.length) {
    alert(t('no_fav'));
    return;
  }
  const blob = new Blob([JSON.stringify(favorites.map(f => ({
    code: f.code, title: f.title, date: f.date, actresses: f.actresses,
    cover: f.cover, images: f.images, addedAt: f.addedAt,
  })), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'dm9-favorites.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    const priceHtml = w.price

      : '';
    const bookmarkHtml = isRanking && w.bookmarkCount
      ? `<span class="card-tag">♥ ${w.bookmarkCount.toLocaleString()}</span>` : '';
    const genresHtml = currentMode === 'search' && Array.isArray(w.genres)
      ? w.genres.slice(0, 3).map(g => `<span class="card-tag tag-genre">${escHtml(g.name || '')}</span>`).join('')
      : '';

    const dateHtml = w.deliveryStartAt ? `<span class="card-date">${escHtml(fmtRelease(w.deliveryStartAt))}</span>` : '';
    return `
      <div class="card fade-in" style="animation-delay:${i*30}ms"

        <img class="card-img" src="${w.cover.medium || w.cover.large || ''}" alt="${escAttr(w.title || '')}" loading="lazy"
          onerror="this.style.background='linear-gradient(135deg,var(--border),var(--border))'">
        <div class="card-body">
          ${rankHtml}
          <div class="card-title">${escHtml(w.title)}</div>
          <div class="card-sub">
            ${codeHtml}

          </div>
          <div class="card-meta">
            <span class="card-tag">${escHtml(w.maker?.name || '')}</span>
            ${actresses ? `<span class="card-tag">${escHtml(actresses)}</span>` : ''}
            ${bookmarkHtml}
            ${w.review?.count ? `<span class="card-tag">★ ${w.review.average}</span>` : ''}
            ${genresHtml}
            ${labelHtml}
          </div>
          ${priceHtml}
        </div>
      </div>`;
  }).join('');
  renderPagination(data);
}

function fmtRelease(s) {
  return String(s || '').slice(0, 10);
}

// Convert a DMM CID (e.g. "1dldss00515", "h_086jrze00318") to its 番号 code:
// uppercase maker + "-" + serial number.
// Serial leading zeros are stripped, but the result must stay at least 3 digits,
// so zeros are re-added only when the effective value would be shorter than 3.
// e.g. 1dldss00515 -> DLDSS-515, 1fns00241 -> FNS-241, 1abc00100 -> ABC-100, 1abc10 -> ABC-010
function cidToCode(cid) {
  let s = String(cid || '').trim().toLowerCase();
  if (!s) return '';
  if (s.startsWith('h_')) s = s.slice(2);
  const m = s.match(/(\d+)$/);
  const num = m ? m[1] : '';
  const rest = num ? s.slice(0, s.length - num.length) : s;
  const maker = rest.replace(/^\d+/, '').toUpperCase();
  if (!maker) return cid;
  let digits = num.replace(/^0+/, '');
  if (!digits) digits = '0';
  while (digits.length < 3) digits = '0' + digits;
  return maker + '-' + digits;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== Pagination ==========
function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (!data) { el.innerHTML = ''; return; }
  const page = Math.floor(data.offset / data.limit) + 1;
  const totalPages = Math.ceil(data.total / data.limit);
  el.innerHTML = `
    <button class="page-btn" onclick="prevPage()" ${data.offset === 0 ? 'disabled' : ''}>${t('prev')}</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button class="page-btn" onclick="nextPage()" ${!data.hasNext ? 'disabled' : ''}>${t('next')}</button>`;
}
function prevPage() { if (currentPage > 0) { currentPage--; loadCurrentData(); } }
function nextPage() { currentPage++; loadCurrentData(); }

// ========== Data Loading ==========
let loadSeq = 0;
let abortCtrl = null;

// Discard any in-flight load: bump the sequence so a late response is dropped
// and abort the underlying fetch. Used on mode switches even when no new
// request follows, so a pending home response can never be rendered with the
// search layout (or vice versa).
function invalidatePendingRequests() {
  loadSeq++;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = null;
}

async function loadData(url) {
  const seq = ++loadSeq;
  const modeAtStart = currentMode;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const container = document.getElementById('cards');
  container.innerHTML = `<div class="status-msg">${t('loading')}</div>`;

  const doFetch = async () => {
    await refreshSession();
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ },
      signal: abortCtrl.signal,
    });
    if (res.status === 401 || res.status === 403) {
      await refreshSession(true);
      return null;
    }
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
  };

  try {
    let data = await doFetch();
    if (data === null) data = await doFetch();
    if (seq !== loadSeq || modeAtStart !== currentMode) return;
    const m = mapResponse(data);
    if (currentMode === 'search') {
      renderSearchResult(m);
    } else {
      renderCards(m);
    }
  } catch (e) {
    if (e.name === 'AbortError' || seq !== loadSeq || modeAtStart !== currentMode) return;
    console.warn('API unavailable, using mock data:', e.message);
    if (currentMode === 'search') {
      container.innerHTML = `<div class="status-msg">${t('load_failed')}</div>`;
      return;
    }
    renderCards(currentMode === 'today'
      ? mockTodayData(DATES[currentDateIdx], currentPage * PAGE_SIZE, PAGE_SIZE)
      : mockRankingData(currentPage * PAGE_SIZE, PAGE_SIZE));
  }
}

async function loadTodayData() {
  const date = DATES[currentDateIdx];
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/todayupdate?date=${date}&offset=${offset}&limit=${PAGE_SIZE}`);
}

async function loadRankingData() {
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/ranking?offset=${offset}&limit=${PAGE_SIZE}`);
}

function loadSearchData() {
  if (!currentSearch) {
    const container = document.getElementById('cards');
    document.getElementById('content-title').textContent = '';
    document.getElementById('content-count').textContent = '';
    container.innerHTML = `<div class="status-msg">${t('search_empty')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/search/${encodeURIComponent(currentSearch)}?offset=${offset}&hits=${PAGE_SIZE}`);
}

function enterSearchMode() {
  if (currentMode === 'today' || currentMode === 'ranking') {
    lastMode = currentMode;
  }
  currentMode = 'search';
  currentPage = 0;
  invalidatePendingRequests();
  document.getElementById('search-pill').classList.add('open');
  document.getElementById('timeline-section').style.display = 'none';
  syncModeButtons();
  updateSubtitle();
  const input = document.getElementById('search-input');
  if (currentSearch && !input.value) input.value = currentSearch;
  updateSearchClear();
  updateSearchRankBtn();
  updateFavToolbarVisible();
  setTimeout(() => { input.focus(); input.select(); }, 60);
  updateHash();
}

function toggleSearchPill() {
  const pill = document.getElementById('search-pill');
  const wasOpen = pill.classList.contains('open');
  if (wasOpen) {
    pill.classList.remove('open');
    if (currentMode === 'search') {
      switchMode(lastMode in { today:1, ranking:1 } ? lastMode : 'today');
    }
    return;
  }
  enterSearchMode();
  loadSearchData();
}

function updateSearchClear() {
  const btn = document.getElementById('search-clear');
  if (!btn) return;
  btn.style.display = document.getElementById('search-input').value ? '' : 'none';
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  updateSearchClear();
  input.focus();
}

// ---- Search rankings (top 20 most-searched 番号) ----
function updateSearchRankBtn() {
  const btn = document.getElementById('btn-searchrank');
  if (!btn) return;
  btn.style.display = currentMode === 'search' ? '' : 'none';
}

function mockSearchRank() {
  const seed = [
    'SSNI-111', 'ABP-477', 'IPX-685', 'STARS-876', 'MIAA-777',
    'JUFE-123', 'PRED-234', 'MIDE-345', 'STAR-456', 'ONSD-567',
    'REAL-678', 'SDAB-999', 'HMN-111', 'NIMR-555', 'EBOD-222',
    'KAVR-333', 'MEYD-444', 'PRTD-888', 'CAWD-001', 'SSIS-002',
  ];
  const items = seed.map((code, i) => ({ code, count: 1000 - i * 47 + (i % 3) * 13 }));
  return items.slice(0, 20);
}

function escCodeForRankAttrs(c) { return escAttr(c); }

function openSearchRank() {
  const overlay = document.getElementById('searchrank-modal');
  const list = document.getElementById('sr-rank-list');
  const enter = () => { overlay.classList.add('open'); };

  const render = (items) => {
    if (!items || !items.length) {
      list.innerHTML = `<div class="sr-rank-empty">${t('searchrank_empty')}</div>`;
      document.getElementById('sr-rank-sub').textContent = t('searchrank_sub', 0);
      return;
    }
    const sub = document.getElementById('sr-rank-sub');
    sub.textContent = null;
    document.getElementById('sr-rank-sub').textContent = t('searchrank_sub', items.length);
    list.innerHTML = items.map((it, i) => `
      <div class="sr-rank-item" onclick="searchRankGo('${escCodeForRankAttrs(it.code)}')">
        <span class="sr-rank-no">${i + 1}</span>
        <span class="sr-rank-code">${escHtml(it.code)}</span>
        <span class="sr-rank-count">${t('searchrank_count', it.count)}</span>
      </div>`).join('');
  };

  (async () => {
    let items = null;
    try {
      await refreshSession();
      const res = await fetch('/api/searchrank', { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
      if (res.ok) {
        const data = await res.json();
        items = (data && data.items) || null;
      }
    } catch (e) { /* fall through to mock */ }
    if (!items) items = mockSearchRank();
    render(items);
    enter();
  })();
}

function searchRankGo(code) {
  closeSearchRank();
  runSearchByCode(code);
}

function closeSearchRank() {
  document.getElementById('searchrank-modal').classList.remove('open');
}

function runSearch() {
  const input = document.getElementById('search-input');
  const val = input.value.trim().toUpperCase();
  if (!val) {
    input.focus();
    return;
  }
  if (!isValidCode(val)) {
    currentMode = 'search';
    currentPage = 0;
    invalidatePendingRequests();
    currentSearch = '';
    enterSearchMode();
    renderSearchInvalid();
    input.focus();
    input.select();
    return;
  }
  currentMode = 'search';
  currentPage = 0;
  currentSearch = val;
  enterSearchMode();
  loadSearchData();
  updateHash();
}

// A valid 番号 is made of letters and digits with at most one hyphen:
//   letters+digits (ABF365 / SIRO5665)      letters-digits (ABP-477)
//   digits+letters+digits (123ABC456)       digits+letters-digits (200GANA-2359)
const VALID_CODE_RE = /^([A-Z]+-?\d+|\d+[A-Z]+-?\d+)$/;
function isValidCode(v) {
  return VALID_CODE_RE.test(v);
}

function renderSearchInvalid() {
  const container = document.getElementById('cards');
  document.getElementById('content-title').textContent = '';
  document.getElementById('content-count').textContent = '';
  container.innerHTML = `<div class="status-msg">${t('search_invalid')}</div>`;
  document.getElementById('pagination').innerHTML = '';
}

function runSearchByCode(code) {
  if (!code) return;
  const input = document.getElementById('search-input');
  if (input) input.value = code;
  updateSearchClear();
  currentMode = 'search';
  currentPage = 0;
  currentSearch = code.toUpperCase();
  enterSearchMode();
  loadSearchData();
  updateHash();
}

function onSearchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    runSearch();
  }
}

function updateSubtitle() {
  document.getElementById('header-sub').textContent =
    currentMode === 'today' ? t('subtitle_today')
    : currentMode === 'search' ? t('subtitle_search')
    : currentMode === 'fav' ? t('subtitle_fav')
    : t('subtitle_ranking');
}

function loadCurrentData() {
  if (currentMode === 'search') {
    loadSearchData();
    return;
  }
  if (currentMode === 'fav') {
    renderFavorites();
    return;
  }
  currentMode === 'today' ? loadTodayData() : loadRankingData();
}

// ========== Mode Switch ==========

// Persist the current view in location.hash so a page refresh / browser
// back-forward lands on the same interface: `#today`, `#today/2026-09-08`,
// `#ranking`, `#search`, `#search/ABF-365`. replaceState avoids polluting
// history and does not fire hashchange.
function updateHash() {
  let hash = `#${currentMode}`;
  if (currentMode === 'search' && currentSearch) {
    hash = `#search/${currentSearch}`;
  } else if (currentMode === 'today') {
    const d = DATES[currentDateIdx] || TODAY;
    if (d !== TODAY) hash = `#today/${d}`;
  } else if (currentMode === 'fav') {
    hash = '#fav';
  }
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

function goToday() {
  switchMode('today');
  const todayIdx = DATES.indexOf(TODAY);
  if (currentDateIdx !== todayIdx) {
    currentDateIdx = todayIdx;
    currentPage = 0;
    renderTimeline();
    syncModeButtons();
    loadTodayData();
  }
}

function syncModeButtons() {
  const todayActive = currentMode === 'today' && DATES[currentDateIdx] === TODAY;
  document.getElementById('btn-today').classList.toggle('active', todayActive);
  document.getElementById('btn-ranking').classList.toggle('active', currentMode === 'ranking');
  document.getElementById('btn-search').classList.toggle('active', currentMode === 'search');
  const favsBtn = document.getElementById('btn-favs');
  if (favsBtn) favsBtn.classList.toggle('active', currentMode === 'fav');
}

function switchMode(mode) {
  currentMode = mode;
  currentPage = 0;
  invalidatePendingRequests();
  if (mode === 'today' || mode === 'ranking') {
    lastMode = mode;
    currentSearch = '';
    const input = document.getElementById('search-input');
    if (input) input.value = '';
  }
  if (mode === 'fav') {
    lastMode = lastMode || 'today';
    const input = document.getElementById('search-input');
    if (input) input.value = '';
    currentSearch = '';
  }
  document.getElementById('timeline-section').style.display = mode === 'today' ? '' : 'none';
  document.getElementById('search-pill').classList.toggle('open', mode === 'search');
  updateSearchClear();
  updateSearchRankBtn();
  updateSubtitle();
  if (mode === 'today') {
    const todayIdx = DATES.indexOf(TODAY);
    if (currentDateIdx !== todayIdx) {
      currentDateIdx = todayIdx;
      renderTimeline();
    }
  }
  syncModeButtons();
  loadCurrentData();
  updateHash();
  updateFavToolbarVisible();
}

// ========== 18+ / NSFW Gate ==========
function confirmGate() {
  if (document.getElementById('gate-remember').checked) {
    localStorage.setItem('dm9_age_ok', '1');
  }
  document.getElementById('gate').classList.remove('open');
  document.body.classList.remove('gated');
  initApp();
}

function leaveGate() {
  window.location.href = 'about:blank';
}

function checkGate() {
  const already = localStorage.getItem('dm9_age_ok') === '1';
  if (already) {
    document.body.classList.remove('gated');
    initApp();
  } else {
    document.getElementById('gate').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
  }
}

// ========== Init ==========

// Request persistent storage for local favorites (IndexedDB) so the browser is
// less likely to evict the origin's data under storage pressure. Best-effort,
// non-blocking, and only on secure contexts (HTTPS / localhost) where the
// StorageManager API exists. Never awaited — persistence is a nice-to-have.
function requestPersistFavorites() {
  if (!navigator.storage || typeof navigator.storage.persist !== 'function') return;
  navigator.storage.persist().catch(() => {});
}

function initApp() {
  document.documentElement.style.overflow = '';
  document.getElementById('calendar-input').max = TODAY;
  requestPersistFavorites();
  loadFavorites();
  renderTimeline();
  applyTheme();
  applyBrowse();
  applyLang();
  initDrag();

  // Restore the view saved in location.hash so a refresh lands on the same
  // interface (#today[/YYYY-MM-DD] / #ranking / #search[/番号] / #fav).
  const hash = location.hash.replace(/^#/, '');
  if (hash === 'ranking') {
    switchMode('ranking'); // switchMode loads the data itself
    return;
  }
  if (hash === 'fav') {
    switchMode('fav');
    return;
  }
  if (hash === 'today' || hash.startsWith('today/')) {
    const date = (hash.split('/')[1] || '').replace(/\s/g, '');
    if (date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= TODAY) {
      // Same date-restore path as pickCalendarDate: unknown dates (outside the
      // recent 30-day window) are appended to DATES so the timeline shows them.
      currentDateIdx = DATES.indexOf(date);
      if (currentDateIdx === -1) {
        DATES.push(date);
        DATES.sort();
        currentDateIdx = DATES.indexOf(date);
      }
      currentPage = 0;
      document.getElementById('timeline-section').style.display = '';
      document.getElementById('search-pill').classList.remove('open');
      renderTimeline();
      syncModeButtons();
      updateSubtitle();
      loadTodayData();
      return;
    }
    switchMode('today');
    return;
  }
  if (hash.startsWith('search')) {
    const code = (hash.split('/')[1] || '').toUpperCase();
    if (code && !currentSearch) {
      currentSearch = code;
      document.getElementById('search-input').value = code;
    }
    enterSearchMode();
    loadSearchData();
    return;
  }
  loadTodayData();
}

checkGate();
</script>
