<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMM Daily Updates</title>
<style>
  :root {
    --bg: #f7faf8;
    --card-bg: #ffffff;
    --primary: #6b9e8a;
    --primary-light: #b5d4c7;
    --primary-dark: #4a7a66;
    --accent: #e8a87c;
    --text: #3d405b;
    --text-light: #8d8fa6;
    --border: #e4ece8;
    --shadow: 0 2px 12px rgba(61,64,91,0.06);
    --radius: 12px;
  }
  [data-theme="sakura"] {
    --bg: #fdf6f8;
    --card-bg: #ffffff;
    --primary: #d4899a;
    --primary-light: #f0c4cf;
    --primary-dark: #b8606e;
    --accent: #f2c078;
    --text: #5a3e44;
    --text-light: #a88a92;
    --border: #f0dde2;
    --shadow: 0 2px 12px rgba(180,100,120,0.06);
  }
  [data-theme="lavender"] {
    --bg: #f6f4fb;
    --card-bg: #ffffff;
    --primary: #9a8cbf;
    --primary-light: #cbc3e0;
    --primary-dark: #7263a3;
    --accent: #e0a0b0;
    --text: #3e3758;
    --text-light: #9189a8;
    --border: #e4dff0;
    --shadow: 0 2px 12px rgba(100,80,160,0.06);
  }
  [data-theme="ocean"] {
    --bg: #f3f8fb;
    --card-bg: #ffffff;
    --primary: #5b98b8;
    --primary-light: #b0d2e4;
    --primary-dark: #3a7494;
    --accent: #f0b87a;
    --text: #354555;
    --text-light: #8299ad;
    --border: #dce8f0;
    --shadow: 0 2px 12px rgba(60,100,140,0.06);
  }
  [data-theme="apricot"] {
    --bg: #fdf8f3;
    --card-bg: #ffffff;
    --primary: #d4a06a;
    --primary-light: #edcfac;
    --primary-dark: #b07a3e;
    --accent: #c07882;
    --text: #4a3e35;
    --text-light: #a89682;
    --border: #f0e4d6;
    --shadow: 0 2px 12px rgba(160,110,60,0.06);
  }
  [data-theme="night"] {
    --bg: #1a1b26;
    --card-bg: #24263a;
    --primary: #7aa2a0;
    --primary-light: #4a6260;
    --primary-dark: #a3cec5;
    --accent: #e0a07c;
    --text: #c0caf5;
    --text-light: #565f89;
    --border: #3b3e57;
    --shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- header ---- */
  .header {
    text-align: center;
    padding: 36px 20px 0;
    position: relative;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--primary-dark);
  }
  .header p {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* ---- settings bar ---- */
  .settings-bar {
    position: absolute;
    top: 20px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .settings-btn {
    padding: 5px 12px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 5px;
    user-select: none;
  }
  .settings-btn:hover {
    border-color: var(--primary);
    color: var(--primary-dark);
  }
  .settings-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .settings-btn .icon {
    font-size: 14px;
    line-height: 1;
  }

  /* ---- theme switcher ---- */
  .theme-picker {
    position: relative;
  }
  .theme-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    z-index: 100;
    min-width: 130px;
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    border: none;
    background: none;
    width: 100%;
    font-size: 12px;
    color: var(--text);
    text-align: left;
  }
  .theme-option:hover {
    background: var(--primary-light);
    color: #fff;
  }
  .theme-option.active {
    background: var(--primary);
    color: #fff;
    font-weight: 600;
  }
  .theme-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid rgba(0,0,0,.1);
  }

  /* ---- mode switch ---- */
  .mode-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0 0;
  }
  .mode-btn {
    padding: 7px 22px;
    border-radius: 20px;
    border: 1.5px solid var(--primary-light);
    background: transparent;
    color: var(--primary-dark);
    font-size: 13px;
    cursor: pointer;
    transition: all .25s;
    font-weight: 500;
  }
  .mode-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .mode-btn:hover:not(.active) {
    background: var(--primary-light);
    color: #fff;
  }

  /* ---- timeline ---- */
  .timeline-section {
    padding: 30px 0 0;
  }
  .timeline-wrap {
    position: relative;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .timeline-track {
    position: relative;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  .timeline-track::before,
  .timeline-track::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary-light);
  }
  .timeline-track::before { left: -4px; }
  .timeline-track::after  { right: -4px; }
  .timeline-dots {
    display: flex;
    justify-content: space-between;
    position: relative;
    top: -6px;
  }
  .timeline-dot {
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2.5px solid var(--primary-light);
    cursor: pointer;
    transition: all .25s;
    position: relative;
    z-index: 1;
  }
  .timeline-dot:hover {
    transform: scale(1.3);
    border-color: var(--primary);
  }
  .timeline-dot.active {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.25);
    box-shadow: 0 0 0 4px rgba(124,154,146,0.2);
  }
  .timeline-labels {
    display: flex;
    justify-content: space-between;
    padding: 8px 0 0;
  }
  .timeline-label {
    font-size: 11px;
    color: var(--text-light);
    width: 15px;
    text-align: center;
    cursor: pointer;
    transition: color .2s;
  }
  .timeline-label.active {
    color: var(--primary-dark);
    font-weight: 600;
  }

  /* ---- content area ---- */
  .content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .content-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .content-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-dark);
  }
  .content-count {
    font-size: 12px;
    color: var(--text-light);
  }

  /* ---- cards grid ---- */
  .cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s, box-shadow .2s;
    cursor: default;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(61,64,91,0.1);
  }
  .card-img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--border);
    display: block;
  }
  .card-body {
    padding: 14px 16px 16px;
  }
  .card-rank {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(232,168,124,0.12);
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--text-light);
  }
  .card-tag {
    background: rgba(124,154,146,0.08);
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .card-price {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
  }
  .card-price .original {
    text-decoration: line-through;
    color: var(--text-light);
    font-weight: 400;
    margin-left: 4px;
    font-size: 11px;
  }

  /* ---- pagination ---- */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
  }
  .page-btn {
    padding: 6px 16px;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary-dark);
  }
  .page-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  .page-info {
    font-size: 13px;
    color: var(--text-light);
    padding: 0 8px;
  }

  /* ---- loading / empty ---- */
  .status-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* ---- footer / copyright ---- */
  .site-footer {
    position: fixed;
    right: 16px;
    bottom: 10px;
    font-size: 11px;
    color: var(--text-light);
    opacity: .8;
    z-index: 5;
    user-select: none;
  }

  /* ---- fade in ---- */
  .fade-in {
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn .2s ease;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    max-width: 960px;
    width: 92vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .modal-img-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    overflow: hidden;
  }
  .modal-img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  .modal-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.85);
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, transform .15s;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    z-index: 2;
  }
  .modal-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.08); }
  .modal-arrow.left  { left: 12px; }
  .modal-arrow.right { right: 12px; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.85);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: background .2s;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .modal-close:hover { background: #fff; }
  .modal-footer {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .modal-counter {
    font-size: 13px;
    color: var(--text-light);
    min-width: 60px;
  }
  .modal-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .modal-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: rgba(124,154,146,0.1);
    color: var(--primary-dark);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="header">
  <h1 data-i18n="title">DMM Daily Updates</h1>
  <p id="header-sub" data-i18n="subtitle_today">Daily new releases timeline</p>
  <div class="settings-bar">
    <div class="theme-picker">
      <button class="settings-btn" id="btn-theme" onclick="toggleThemeDropdown()">
        <span class="icon">🎨</span>
      </button>
      <div class="theme-dropdown" id="theme-dropdown"></div>
    </div>
    <button class="settings-btn" id="btn-lang" onclick="toggleLang()">
      <span class="icon" id="lang-icon">EN</span>
    </button>
  </div>
</div>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-today" onclick="switchMode('today')" data-i18n="btn_today">Today Update</button>
  <button class="mode-btn" id="btn-ranking" onclick="switchMode('ranking')" data-i18n="btn_ranking">Hot Ranking</button>
</div>

<!-- timeline (only for today mode) -->
<div class="timeline-section" id="timeline-section">
  <div class="timeline-wrap">
    <div class="timeline-track"></div>
    <div class="timeline-dots" id="timeline-dots"></div>
    <div class="timeline-labels" id="timeline-labels"></div>
  </div>
</div>

<div class="content">
  <div class="content-header">
    <span class="content-title" id="content-title">Loading...</span>
    <span class="content-count" id="content-count"></span>
  </div>
  <div class="cards" id="cards"></div>
  <div class="pagination" id="pagination"></div>
</div>

<footer class="site-footer">
  <span>Powered by eulerme with ❤️ @2026</span>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <button class="modal-arrow left" onclick="modalPrev()">&#8249;</button>
    <button class="modal-arrow right" onclick="modalNext()">&#8250;</button>
    <div class="modal-img-wrap">
      <img class="modal-img" id="modal-img" src="" alt="">
    </div>
    <div class="modal-footer">
      <span class="modal-counter" id="modal-counter">1 / 1</span>
      <span class="modal-title" id="modal-title"></span>
      <span class="modal-badge" id="modal-badge"></span>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script>
// ========== i18n ==========
const I18N = {
  zh: {
    title: 'DMM影片每日更新',
    subtitle_today: '每日新作时间线',
    subtitle_ranking: '按销量排序的热门作品',
    btn_today: '今日上架',
    btn_ranking: '热门排行',
    total: '共 %d 部',
    updates: '更新 — %s',
    ranking: '热门排行',
    no_data: '暂无数据',
    cover: '封面',
    sample: '样片',
    prev: '← 上一页',
    next: '下一页 →',
    no_img: '暂无图片',
    loading: '加载中...',
  },
  en: {
    title: 'DMM Daily Updates',
    subtitle_today: 'Daily new releases timeline',
    subtitle_ranking: 'Popular items by sales rank',
    btn_today: 'Today Update',
    btn_ranking: 'Hot Ranking',
    total: 'Total %d items',
    updates: 'Updates — %s',
    ranking: 'Hot Ranking',
    no_data: 'No data available',
    cover: 'Cover',
    sample: 'Sample',
    prev: '← Prev',
    next: 'Next →',
    no_img: 'No Image',
    loading: 'Loading...',
  },
};
let currentLang = localStorage.getItem('lang') || 'zh';
let currentTheme = localStorage.getItem('theme') || 'mint';

const THEMES = [
  { id: 'mint',     name_zh: '薄荷绿',  name_en: 'Mint',     color: '#6b9e8a' },
  { id: 'sakura',   name_zh: '樱花粉',  name_en: 'Sakura',   color: '#d4899a' },
  { id: 'lavender', name_zh: '薰衣草',  name_en: 'Lavender', color: '#9a8cbf' },
  { id: 'ocean',    name_zh: '海洋蓝',  name_en: 'Ocean',    color: '#5b98b8' },
  { id: 'apricot',  name_zh: '暖杏色',  name_en: 'Apricot',  color: '#d4a06a' },
  { id: 'night',    name_zh: '夜猫黑',  name_en: 'Night',    color: '#3b3e57' },
];

function t(key, ...args) {
  let s = (I18N[currentLang] || I18N.en)[key] || key;
  s = s.replace(/%d/g, () => args[0] ?? '');
  s = s.replace(/%s/g, () => args[0] ?? '');
  return s;
}

function applyLang() {
  document.getElementById('lang-icon').textContent = currentLang === 'zh' ? '中' : 'EN';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (el.id === 'header-sub') return;
    el.textContent = t(key);
  });
  document.getElementById('header-sub').textContent =
    currentMode === 'today' ? t('subtitle_today') : t('subtitle_ranking');
  renderThemeDropdown();
  loadCurrentData();
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', currentLang);
  applyLang();
}

// ========== Theme ==========
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  renderThemeDropdown();
}

function renderThemeDropdown() {
  const el = document.getElementById('theme-dropdown');
  const lang = currentLang;
  el.innerHTML = THEMES.map(th => {
    const name = lang === 'zh' ? th.name_zh : th.name_en;
    const active = th.id === currentTheme ? ' active' : '';
    return `<button class="theme-option${active}" onclick="setTheme('${th.id}')">
      <span class="theme-dot" style="background:${th.color}"></span>
      ${name}
    </button>`;
  }).join('');
}

function setTheme(id) {
  currentTheme = id;
  localStorage.setItem('theme', id);
  applyTheme();
  document.getElementById('theme-dropdown').classList.remove('open');
}

function toggleThemeDropdown() {
  document.getElementById('theme-dropdown').classList.toggle('open');
}

document.addEventListener('click', e => {
  const picker = document.querySelector('.theme-picker');
  if (!picker.contains(e.target)) {
    document.getElementById('theme-dropdown').classList.remove('open');
  }
});

// ========== Mock Data ==========
const AWS = 'https://awsimgsrc.dmm.co.jp/pics_dig/digital/video';
const MOCK_IDS = [

  '1fns00244','1dldss00552','1dldss00545','1dldss00541','1fns00243',
  '1dldss00521','1dldss00539','1dldss00544','1dldss00551','1fns00242',
  '1dldss00543','h_086jrze00318','1nhdtc00246','1mist00529','1fns00206',
];
const MOCK_ACTRESSES = [
  [{ id:"1", name:"柏木雫" }],
  [{ id:"2", name:"叶愛" }],
  [{ id:"3", name:"宮上唯依花" }],
  [{ id:"4", name:"谷原希美" },{ id:"5", name:"那賀ゆきね" }],
  [{ id:"6", name:"櫻羽潤" }],
  [{ id:"7", name:"神喜ミア" }],
  [{ id:"8", name:"小沢菜穂" }],
  [{ id:"9", name:"角保奈保" },{ id:"10", name:"花守夏歩" }],
  [{ id:"11", name:"美乃すずめ" }],
  [{ id:"12", name:"湊莉久" }],
];
const MOCK_MAKERS = [
  { id:"1", name:"FALENO" }, { id:"2", name:"DAHLIA" },
  { id:"3", name:"S-Cute" }, { id:"4", name:"エスワン" },
  { id:"5", name:"S1 NO.1 STYLE" }, { id:"6", name:"IDEA POCKET" },

function mockImages(id) {
  const imgs = [];
  imgs.push({ type:'cover', url: `${AWS}/${id}/${id}pl.jpg` });
  for (let n = 1; n <= 10; n++) {
    imgs.push({ type:'sample', url: `${AWS}/${id}/${id}jp-${n}.jpg` });
  }
  return imgs;
}

function mockTodayData(date, offset, limit) {
  const total = 60;
  const works = [];
  const end = Math.min(offset + limit, total);
  for (let i = offset; i < end; i++) {
    const mid = MOCK_IDS[i % MOCK_IDS.length];
    const hasDiscount = Math.random() > 0.6;
    const price = [580, 1120, 2180, 2480, 3980][i % 5];
    works.push({
      id: mid, title: MOCK_TITLES[i % MOCK_TITLES.length],
      cover: { medium: `${AWS}/${mid}/${mid}ps.jpg`, large: `${AWS}/${mid}/${mid}pl.jpg` },
      images: mockImages(mid),
      deliveryStartAt: `${date}T${String(12-Math.floor(i/6)).padStart(2,"0")}:${String(i*7%60).padStart(2,"0")}:00+09:00`,
      actresses: MOCK_ACTRESSES[i % MOCK_ACTRESSES.length],

// ========== API Helper ==========

// Map API work → frontend format (sampleImages → images for modal)
function mapWork(w) {
  const images = [];
  if (w.cover && w.cover.large) {
    images.push({ type: 'cover', url: w.cover.large });
  }
  if (w.sampleImages && w.sampleImages.length) {
    w.sampleImages.forEach(s => {
      if (s.largeUrl) images.push({ type: 'sample', url: s.largeUrl });
    });
  }
  return Object.assign({}, w, { images });
}

function mapResponse(data) {
  if (!data || !data.works) return data;
  return Object.assign({}, data, {
    works: data.works.map(mapWork),
  });
}

// ========== State ==========
let currentMode = 'today';
let currentDateIdx = 0;
let currentPage = 0;
const PAGE_SIZE = 30;
let modalImages = [];
let modalIdx = 0;

function getRecentDates() {
  const dates = [];
  const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}
const DATES = getRecentDates();

// ========== Timeline ==========
function renderTimeline() {
  const dotsEl = document.getElementById('timeline-dots');
  const labelsEl = document.getElementById('timeline-labels');
  dotsEl.innerHTML = '';
  labelsEl.innerHTML = '';
  DATES.forEach((d, i) => {
    const dot = document.createElement('div');
    dot.className = 'timeline-dot' + (i === currentDateIdx ? ' active' : '');
    dot.onclick = () => selectDate(i);
    dotsEl.appendChild(dot);
    const label = document.createElement('div');
    label.className = 'timeline-label' + (i === currentDateIdx ? ' active' : '');
    label.textContent = d.slice(5);
    label.onclick = () => selectDate(i);
    labelsEl.appendChild(label);
  });
}

function selectDate(idx) {
  currentDateIdx = idx;
  currentPage = 0;
  renderTimeline();
  loadTodayData();
}

// ========== Modal ==========
function openModal(work) {
  modalImages = work.images || [];
  if (modalImages.length === 0) return;
  modalIdx = 0;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateModal();
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function modalPrev() {
  if (modalIdx > 0) { modalIdx--; updateModal(); }
}
function modalNext() {
  if (modalIdx < modalImages.length - 1) { modalIdx++; updateModal(); }
}
function updateModal() {
  const img = modalImages[modalIdx];
  document.getElementById('modal-img').src = img ? img.url : '';
  document.getElementById('modal-counter').textContent = `${modalIdx + 1} / ${modalImages.length}`;
  const badge = document.getElementById('modal-badge');
  badge.textContent = img && img.type === 'cover' ? t('cover') : t('sample');
  document.querySelector('.modal-arrow.left').style.visibility = modalIdx > 0 ? '' : 'hidden';
  document.querySelector('.modal-arrow.right').style.visibility = modalIdx < modalImages.length - 1 ? '' : 'hidden';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') modalPrev();
  if (e.key === 'ArrowRight') modalNext();
});

// ========== Cards ==========
function renderCards(data) {
  const container = document.getElementById('cards');
  const titleEl = document.getElementById('content-title');
  const countEl = document.getElementById('content-count');

  if (!data || !data.works || data.works.length === 0) {
    container.innerHTML = `<div class="status-msg">${t('no_data')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const isRanking = currentMode === 'ranking';
  titleEl.textContent = isRanking
    ? t('ranking')
    : t('updates', data.date);
  countEl.textContent = t('total', data.total);

  container.innerHTML = data.works.map((w, i) => {
    const actresses = Array.isArray(w.actresses) ? w.actresses.map(a => a && a.name).filter(Boolean).join(' / ') : '';
    const rankHtml = isRanking ? `<div class="card-rank">#${w.rank}</div>` : '';
    const priceHtml = w.price
      ? `<div class="card-price">${w.price.price}円${w.price.discountPrice ? `<span class="original">${w.price.discountPrice}円</span>` : ''}</div>`
      : '';
    const bookmarkHtml = isRanking && w.bookmarkCount
      ? `<span class="card-tag">♥ ${w.bookmarkCount.toLocaleString()}</span>` : '';
    return `
      <div class="card fade-in" style="animation-delay:${i*30}ms" onclick='openModal(${escAttr(JSON.stringify({images:w.images||[],title:w.title}))})'>
        <img class="card-img" src="${w.cover.medium || w.cover.large || ''}" alt="" loading="lazy" onerror="this.style.background='linear-gradient(135deg,var(--border),var(--border))'">
        <div class="card-body">
          ${rankHtml}
          <div class="card-title">${escHtml(w.title)}</div>
          <div class="card-meta">
            <span class="card-tag">${escHtml(w.maker?.name || '')}</span>
            ${actresses ? `<span class="card-tag">${escHtml(actresses)}</span>` : ''}
            ${bookmarkHtml}
            ${w.review?.count ? `<span class="card-tag">★ ${w.review.average}</span>` : ''}
          </div>
          ${priceHtml}
        </div>
      </div>`;
  }).join('');
  renderPagination(data);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== Pagination ==========
function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (!data) { el.innerHTML = ''; return; }
  const page = Math.floor(data.offset / data.limit) + 1;
  const totalPages = Math.ceil(data.total / data.limit);
  el.innerHTML = `
    <button class="page-btn" onclick="prevPage()" ${data.offset === 0 ? 'disabled' : ''}>${t('prev')}</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button class="page-btn" onclick="nextPage()" ${!data.hasNext ? 'disabled' : ''}>${t('next')}</button>`;
}
function prevPage() { if (currentPage > 0) { currentPage--; loadCurrentData(); } }
function nextPage() { currentPage++; loadCurrentData(); }

// ========== Data Loading ==========
let loadSeq = 0;
let abortCtrl = null;

function loadData(url) {
  const seq = ++loadSeq;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const container = document.getElementById('cards');
  container.innerHTML = `<div class="status-msg">${t('loading')}</div>`;
  return fetch(url, {
    headers: { 'Authorization': 'Bearer ' + (window.__API_TOKEN__ || '') },
    signal: abortCtrl.signal,
  })
    .then(res => {
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    })
    .then(data => {
      if (seq !== loadSeq) return;
      renderCards(mapResponse(data));
    })
    .catch(e => {
      if (e.name === 'AbortError' || seq !== loadSeq) return;
      console.warn('API unavailable, using mock data:', e.message);
      renderCards(currentMode === 'today'
        ? mockTodayData(DATES[currentDateIdx], currentPage * PAGE_SIZE, PAGE_SIZE)
        : mockRankingData(currentPage * PAGE_SIZE, PAGE_SIZE));
    });
}

async function loadTodayData() {
  const date = DATES[currentDateIdx];
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/todayupdate?date=${date}&offset=${offset}&limit=${PAGE_SIZE}`);
}

async function loadRankingData() {
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/ranking?offset=${offset}&limit=${PAGE_SIZE}`);
}
function loadCurrentData() {
  currentMode === 'today' ? loadTodayData() : loadRankingData();
}

// ========== Mode Switch ==========
function switchMode(mode) {
  currentMode = mode;
  currentPage = 0;
  document.getElementById('btn-today').classList.toggle('active', mode === 'today');
  document.getElementById('btn-ranking').classList.toggle('active', mode === 'ranking');
  document.getElementById('timeline-section').style.display = mode === 'today' ? '' : 'none';
  document.getElementById('header-sub').textContent =
    mode === 'today' ? t('subtitle_today') : t('subtitle_ranking');
  loadCurrentData();
}

// ========== Init ==========
applyTheme();
applyLang();
renderTimeline();
loadTodayData();
</script>
